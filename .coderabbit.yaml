# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
tone_instructions: >
  Direct and concise. Skip preamble and praise. Lead with the issue, then the
  fix.

reviews:
  profile: assertive
  request_changes_workflow: false
  # No unsolicited summaries: CodeRabbit summarizes only on `@coderabbitai summary`.
  high_level_summary: false
  poem: false
  # Say so when a review is skipped; otherwise the green check reads as reviewed.
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    auto_pause_after_reviewed_commits: 5
    # Every base branch, so stacked PRs (based on another feature branch) are reviewed too.
    base_branches:
      - ".*"
    ignore_usernames:
      - "dependabot[bot]"
    ignore_title_keywords:
      - WIP

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!web/wwwroot/vue/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/*.min.js"
    - "!**/*.min.css"

  pre_merge_checks:
    title:
      mode: warning
      requirements: >
        Conventional Commits `type(scope): subject`, where type is feat, fix,
        refactor, docs, test or chore. When the branch names a JIRA ticket, prefix
        its ID (e.g. `VPR-104 fix(a11y): ...`). Subject is imperative, at most 72
        characters, with no trailing period.
    # Repo convention documents only what isn't clear from the code, so a coverage
    # threshold would warn on nearly every PR.
    docstrings:
      mode: "off"

  tools:
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      level: default
    # Biome's strict JSON parser can't read appsettings*.json (ASP.NET parses those as
    # JSON-with-comments by design), so it warned on every review touching them. Its lint
    # coverage is already provided by CI (oxlint/oxfmt, JSCPD, Fallow, ReSharper, CodeQL).
    biome:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  # Only used when the Jira integration is connected in the CodeRabbit app.
  jira:
    project_keys:
      - VPR
  code_guidelines:
    enabled: true
    filePatterns:
      - ".github/copilot-instructions.md"
      - "CLAUDE.md"
      - "DESIGN.md"
