# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
tone_instructions: >
  Direct and concise. Skip preamble and praise. Lead with the issue, then the
  fix.

reviews:
  profile: assertive
  request_changes_workflow: false
  # No unsolicited summaries: CodeRabbit summarizes only on `@coderabbitai summary`.
  high_level_summary: false
  poem: false
  # Say so when a review is skipped; otherwise the green check reads as reviewed.
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    auto_pause_after_reviewed_commits: 5
    # Every base branch, so stacked PRs (based on another feature branch) are reviewed too.
    base_branches:
      - ".*"
    ignore_usernames:
      - "dependabot[bot]"

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!web/wwwroot/vue/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/*.min.js"
    - "!**/*.min.css"

  pre_merge_checks:
    title:
      mode: warning
      requirements: >
        Conventional Commits `type(scope): subject`, where type is feat, fix,
        refactor, docs, test or chore. When the branch names a JIRA ticket, prefix
        its ID (e.g. `VPR-104 fix(a11y): ...`). Subject is imperative, at most 72
        characters, with no trailing period.
    # Repo convention documents only what isn't clear from the code, so a coverage
    # threshold would warn on nearly every PR.
    docstrings:
      mode: "off"

  # No "Fix comments" or "Fix failing CI" auto-fix offers.
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false

  # Only tools CI does not already cover; github-checks reads CI results. Every
  # tool defaults to on, so each is listed; recheck the schema for new tools.
  tools:
    github-checks:
      enabled: true
    semgrep:
      enabled: true
    skillspector:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    blinter:
      enabled: true
    presidio:
      enabled: true
    languagetool:
      enabled: true
      level: default
    markdownlint:
      enabled: true
    # Off: noisy, irrelevant to this repo, or duplicates CI.
    ast-grep:
      enabled: false
    shellcheck:
      enabled: false
    ruff:
      enabled: false
    biome:
      enabled: false
    hadolint:
      enabled: false
    swiftlint:
      enabled: false
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    golangci-lint:
      enabled: false
    yamllint:
      enabled: false
    trufflehog:
      enabled: false
    checkov:
      enabled: false
    tflint:
      enabled: false
    detekt:
      enabled: false
    eslint:
      enabled: false
    flake8:
      enabled: false
    fbinfer:
      enabled: false
    fortitudeLint:
      enabled: false
    rubocop:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    pmd:
      enabled: false
    clang:
      enabled: false
    cppcheck:
      enabled: false
    vale:
      enabled: false
    verilator:
      enabled: false
    opengrep:
      enabled: false
    circleci:
      enabled: false
    clippy:
      enabled: false
    sqlfluff:
      enabled: false
    squawk:
      enabled: false
    trivy:
      enabled: false
    prismaLint:
      enabled: false
    pylint:
      enabled: false
    oxc:
      enabled: false
    shopifyThemeCheck:
      enabled: false
    luacheck:
      enabled: false
    brakeman:
      enabled: false
    dotenvLint:
      enabled: false
    htmlhint:
      enabled: false
    stylelint:
      enabled: false
    checkmake:
      enabled: false
    oasdiff:
      enabled: false
    reactDoctor:
      enabled: false
    smartyLint:
      enabled: false
    emberTemplateLint:
      enabled: false
    psscriptanalyzer:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  # Only used when the Jira integration is connected in the CodeRabbit app.
  jira:
    project_keys:
      - VPR
  code_guidelines:
    enabled: true
    filePatterns:
      - ".github/copilot-instructions.md"
      - "CLAUDE.md"
      - "DESIGN.md"
