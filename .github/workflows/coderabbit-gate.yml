name: CodeRabbit Gate

# Passes when CodeRabbit's check run succeeded on the head commit and none of
# its threads are unresolved. A clean incremental review posts no PR review at
# all, so the job waits for CodeRabbit's check run instead of a review event.
# A declined finding passes once its thread is resolved and this check is re-run.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  # Catches a CodeRabbit review that finishes after the gate stopped polling.
  # check_run only fires from the default branch's copy of this workflow.
  check_run:
    types: [completed]

permissions:
  pull-requests: read # read CodeRabbit's review threads
  checks: read # read CodeRabbit's check run on the head commit

concurrency:
  # Each trigger type shows as its own check, so only a newer run of the same
  # type may cancel one. check_run fires for every check, so its runs never do.
  group: coderabbit-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coderabbit-gate:
    name: CodeRabbit approval
    # CodeRabbit skips drafts and Dependabot PRs, so there is no verdict to wait for
    if: ${{ github.event_name != 'check_run' && !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check CodeRabbit's review of the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          for _ in $(seq 40); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=CodeRabbit" \
              --jq '.check_runs | sort_by(.id) | last | select(.) | "\(.status) \(.conclusion)"')
            [[ "$run" == completed* ]] && break
            sleep 30
          done
          if [ "$run" != "completed success" ]; then
            echo "::error::CodeRabbit has not reviewed the latest commit (${run:-no run}). If it was rate limited or skipped, comment '@coderabbitai review'."
            exit 1
          fi

          # Findings outside the diff have no thread, so only threaded findings block
          unresolved=$(gh api graphql --paginate --slurp -F pr="$PR" -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -f query='
            query($owner:String!, $repo:String!, $pr:Int!, $endCursor:String) {
              repository(owner:$owner, name:$repo) { pullRequest(number:$pr) {
                reviewThreads(first:100, after:$endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { isResolved comments(first:1) { nodes { author { login } } } }
                }
              } }
            }' | jq '[.[].data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false and .comments.nodes[0].author.login == "coderabbitai")] | length')
          if [ "$unresolved" -gt 0 ]; then
            echo "::error::$unresolved CodeRabbit thread(s) unresolved. Address or resolve them, then re-run this check."
            exit 1
          fi
          echo "CodeRabbit's review of the latest commit is clean."

  rerun-after-coderabbit:
    name: Re-run gate after CodeRabbit finishes
    if: ${{ github.event_name == 'check_run' && github.event.check_run.name == 'CodeRabbit' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # list and re-run this workflow's gate runs
    steps:
      - name: Re-run the commit's failed gate runs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
        # This run reports on the default branch, so re-run the PR's own gate runs
        # instead: the latest of each trigger type, since each shows as its own check
        run: |
          set -o pipefail
          runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow coderabbit-gate.yml --commit "$HEAD_SHA" -L 50 \
            --json databaseId,event,status,conclusion \
            --jq '[.[] | select(.event != "check_run")] | group_by(.event) | map(max_by(.databaseId))
              | .[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled")) | .databaseId')
          if [ -z "$runs" ]; then
            echo "No failed gate run to refresh for $HEAD_SHA."
          fi
          for run in $runs; do
            gh run rerun "$run" -R "$GITHUB_REPOSITORY"
          done
